<svg xmlns="http://www.w3.org/2000/svg" width="680" height="674" viewBox="0 0 680 674" role="img" aria-labelledby="title desc">
<title id="title">Structure of the lets-vibe repository</title>
<desc id="desc">Lets Vibe wraps the Vibe skills and the Addy skills and runs a slice in one of four modes, with copilot as the default. It reads and writes the plans folder, which holds the roadmap, the project pointer and one folder for each slice with its specification, plan, task list and generated progress report.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; dominant-baseline: central; }
.t { font-size: 14px; fill: #2C2C2A; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.mid { text-anchor: middle; }
.purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
.gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
.teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
.coral rect { fill: #FAECE7; stroke: #993C1D; } .coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }
.box rect { fill: #FFFFFF; stroke: #B4B2A9; }
rect { stroke-width: 0.5; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
</defs>
<rect x="0.5" y="0.5" width="679" height="673" rx="12" style="fill:#FFFFFF;stroke:#D3D1C7"/>
<text class="t mid" x="340" y="29" style="dominant-baseline:alphabetic">Follow the README to adopt. To invoke: <tspan class="mono">$lets-vibe</tspan></text>
<g class="purple">
<rect x="40" y="46" width="600" height="292" rx="20"/>
<text class="th mid" x="340" y="70">Lets Vibe</text>
<text class="ts mid" x="340" y="90">Delivers one slice at a time, in one of four modes (Default mode: Copilot)</text>
</g>
<g class="gray">
<rect x="60" y="108" width="128" height="56" rx="8"/>
<text class="th mid" x="124" y="127">Supervised</text>
<text class="ts mid" x="124" y="146">Asks each group</text>
</g>
<g class="gray">
<rect x="204" y="108" width="128" height="56" rx="8"/>
<text class="th mid" x="268" y="127">Copilot</text>
<text class="ts mid" x="268" y="146">Asks each commit</text>
</g>
<g class="gray">
<rect x="348" y="108" width="128" height="56" rx="8"/>
<text class="th mid" x="412" y="127">Autonomous</text>
<text class="ts mid" x="412" y="146">Runs to the close</text>
</g>
<g class="gray">
<rect x="492" y="108" width="128" height="56" rx="8"/>
<text class="th mid" x="556" y="127">Orchestrated</text>
<text class="ts mid" x="556" y="146">T3 Code</text>
</g>
<g class="teal">
<rect x="60" y="188" width="250" height="130" rx="12"/>
<text class="th mid" x="185" y="212">Vibe skills</text>
<text class="ts mid" x="185" y="232">9 workflow skills</text>
<text class="ts mid" x="185" y="262">lets-vibe, review-vibe,</text>
<text class="ts mid" x="185" y="280">test-vibe, progress-report,</text>
<text class="ts mid" x="185" y="298">handoff, walkthrough, 3 more</text>
</g>
<g class="coral">
<rect x="370" y="188" width="250" height="130" rx="12"/>
<text class="th mid" x="495" y="212">Addy skills</text>
<text class="ts mid" x="495" y="232">25 engineering methods</text>
<text class="ts mid" x="495" y="262">Unchanged from upstream:</text>
<text class="ts mid" x="495" y="280">spec, plan, build, test,</text>
<text class="ts mid" x="495" y="298">review, ship and more</text>
</g>
<text class="ts mid" x="340" y="240">selects</text>
<line class="arr" x1="314" y1="253" x2="366" y2="253" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="344" x2="340" y2="392" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="352" y="368">reads and writes</text>
<g class="gray">
<rect x="40" y="398" width="600" height="256" rx="20"/>
<text class="th mid" x="340" y="422">plans/</text>
<text class="ts mid" x="340" y="442">The records that a run reads and writes</text>
</g>
<g class="box">
<rect x="60" y="460" width="272" height="56" rx="8"/>
<text class="th mid" x="196" y="479">roadmap.md</text>
<text class="ts mid" x="196" y="498">Order of the slices</text>
</g>
<g class="box">
<rect x="348" y="460" width="272" height="56" rx="8"/>
<text class="th mid" x="484" y="479">project-state.json</text>
<text class="ts mid" x="484" y="498">Slice, documents, mode</text>
</g>
<g class="box">
<rect x="60" y="532" width="560" height="102" rx="10"/>
<text class="th" x="72" y="550">&lt;slice-id&gt;/</text>
<text class="ts" x="160" y="550">The documents of one slice</text>
</g>
<g class="gray">
<rect x="70" y="566" width="96" height="56" rx="8"/>
<text class="th mid" x="118" y="585">SPEC.md</text>
<text class="ts mid" x="118" y="604">Agreed scope</text>
</g>
<g class="gray">
<rect x="178" y="566" width="126" height="56" rx="8"/>
<text class="th mid" x="241" y="585">tasks/plan.md</text>
<text class="ts mid" x="241" y="604">The approach</text>
</g>
<g class="gray">
<rect x="316" y="566" width="126" height="56" rx="8"/>
<text class="th mid" x="379" y="585">tasks/todo.md</text>
<text class="ts mid" x="379" y="604">Tasks and status</text>
</g>
<g class="gray">
<rect x="454" y="566" width="156" height="56" rx="8"/>
<text class="th mid" x="532" y="585">tasks/progress.md</text>
<text class="ts mid" x="532" y="604">Made from todo.md</text>
</g>
</svg>
